<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--canvas);}
.row{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;gap:6px;width:122px}
.chip{height:64px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.name{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-2)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.aa{font-family:var(--font-sans);font-weight:700;font-size:24px}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:oklch(0.09 0 0)"><span class="aa" style="color:oklch(0.96 0 0)">Aa</span></div><div class="meta"><span class="name">fg-1</span><span class="val">0.96</span></div></div>
  <div class="swatch"><div class="chip" style="background:oklch(0.09 0 0)"><span class="aa" style="color:oklch(0.88 0 0)">Aa</span></div><div class="meta"><span class="name">fg-2</span><span class="val">0.88</span></div></div>
  <div class="swatch"><div class="chip" style="background:oklch(0.09 0 0)"><span class="aa" style="color:oklch(0.65 0 0)">Aa</span></div><div class="meta"><span class="name">fg-3</span><span class="val">0.65</span></div></div>
  <div class="swatch"><div class="chip" style="background:oklch(0.09 0 0)"><span class="aa" style="color:oklch(0.45 0 0)">Aa</span></div><div class="meta"><span class="name">fg-4</span><span class="val">0.45</span></div></div>
  <div class="swatch"><div class="chip" style="background:oklch(0.09 0 0)"><span class="aa" style="color:oklch(0.32 0 0)">Aa</span></div><div class="meta"><span class="name">fg-5</span><span class="val">0.32</span></div></div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--canvas);display:flex;gap:10px;flex-wrap:wrap}
.b{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;padding:3px 7px;border-radius:4px}
</style></head><body>
<span class="b" style="background:var(--hot-bg);color:var(--hot);border:1px solid var(--hot-border)">HOT</span>
<span class="b" style="background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)">WARM</span>
<span class="b" style="background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)">REPLIED</span>
<span class="b" style="background:var(--info-bg);color:var(--info);border:1px solid var(--info-border)">MEETING</span>
<span class="b" style="background:oklch(0.16 0 0);color:var(--fg-4);border:1px solid oklch(0.25 0 0)">DISCOVERED</span>
<span class="b" style="background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)">CONTACTED</span>
<span class="b" style="background:var(--hot-bg);color:var(--hot);border:1px solid var(--hot-border)">BOUNCED</span>
<span class="b" style="background:oklch(0.16 0.03 25);color:oklch(0.55 0.12 25);border:1px solid oklch(0.28 0.06 25)">UNSUB</span>
<span class="b" style="background:var(--success-bg);color:var(--success);border:1px solid var(--success-border)">CONVERTED</span>
</body></html>

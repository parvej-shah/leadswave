<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--canvas)}
.row{display:flex;gap:18px;align-items:flex-end}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{background:var(--amber);border-radius:4px}
.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-4)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--fg-2)}
</style></head><body>
<div class="row">
  <div class="col"><div class="box" style="width:4px;height:4px"></div><div class="lbl">1</div><div class="val">4</div></div>
  <div class="col"><div class="box" style="width:8px;height:8px"></div><div class="lbl">2</div><div class="val">8</div></div>
  <div class="col"><div class="box" style="width:12px;height:12px"></div><div class="lbl">3</div><div class="val">12</div></div>
  <div class="col"><div class="box" style="width:16px;height:16px"></div><div class="lbl">4</div><div class="val">16</div></div>
  <div class="col"><div class="box" style="width:20px;height:20px"></div><div class="lbl">5</div><div class="val">20</div></div>
  <div class="col"><div class="box" style="width:24px;height:24px"></div><div class="lbl">6</div><div class="val">24</div></div>
  <div class="col"><div class="box" style="width:32px;height:32px"></div><div class="lbl">8</div><div class="val">32</div></div>
  <div class="col"><div class="box" style="width:48px;height:48px"></div><div class="lbl">12</div><div class="val">48</div></div>
</div>
</body></html>

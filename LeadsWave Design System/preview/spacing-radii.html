<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--canvas);display:flex;gap:14px;align-items:flex-end}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.b{background:var(--surface);border:1px solid var(--border);width:90px;height:60px}
.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-4);text-align:center}
.val{font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
</style></head><body>
<div class="col"><div class="b" style="border-radius:2px"></div><div class="lbl">xs</div><div class="val">2px</div></div>
<div class="col"><div class="b" style="border-radius:4px"></div><div class="lbl">sm</div><div class="val">4px</div></div>
<div class="col"><div class="b" style="border-radius:6px"></div><div class="lbl">md</div><div class="val">6px</div></div>
<div class="col"><div class="b" style="border-radius:8px"></div><div class="lbl">lg</div><div class="val">8px</div></div>
<div class="col"><div class="b" style="border-radius:12px"></div><div class="lbl">xl · cards</div><div class="val">12px</div></div>
<div class="col"><div class="b" style="border-radius:16px"></div><div class="lbl">2xl</div><div class="val">16px</div></div>
<div class="col"><div class="b" style="border-radius:9999px;width:60px;height:30px"></div><div class="lbl">pill</div><div class="val">9999px</div></div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--canvas);}
.row{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;gap:6px;width:148px}
.chip{height:64px;border-radius:8px;border:1px solid var(--border)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.name{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-2)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.role{font-family:var(--font-mono);font-size:10px;color:var(--fg-4);letter-spacing:.04em}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:oklch(0.09 0 0)"></div><div class="meta"><span class="name">Canvas</span><span class="val">0.09</span></div><div class="role">App background</div></div>
  <div class="swatch"><div class="chip" style="background:oklch(0.10 0 0)"></div><div class="meta"><span class="name">Sidebar</span><span class="val">0.10</span></div><div class="role">Rail, modal base</div></div>
  <div class="swatch"><div class="chip" style="background:oklch(0.14 0 0)"></div><div class="meta"><span class="name">Surface</span><span class="val">0.14</span></div><div class="role">Cards, rows</div></div>
  <div class="swatch"><div class="chip" style="background:oklch(0.16 0 0)"></div><div class="meta"><span class="name">Surface-2</span><span class="val">0.16</span></div><div class="role">Hover, tinted</div></div>
</div>
</body></html>

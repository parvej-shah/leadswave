<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--canvas);}
.row{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;gap:6px;width:148px}
.chip{height:64px;border-radius:8px;border:1px solid var(--border)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.name{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-2)}
.val{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
.role{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
</style></head><body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:var(--amber)"></div><div class="meta"><span class="name" style="color:var(--amber)">Amber</span><span class="val">0.78 0.18 65</span></div><div class="role">Brand · primary · active nav</div></div>
  <div class="swatch"><div class="chip" style="background:var(--hot)"></div><div class="meta"><span class="name" style="color:var(--hot)">Hot</span><span class="val">0.70 0.20 25</span></div><div class="role">HOT · destructive · error</div></div>
  <div class="swatch"><div class="chip" style="background:var(--success)"></div><div class="meta"><span class="name" style="color:var(--success)">Success</span><span class="val">0.72 0.18 145</span></div><div class="role">Replied · converted</div></div>
  <div class="swatch"><div class="chip" style="background:var(--info)"></div><div class="meta"><span class="name" style="color:var(--info)">Info</span><span class="val">0.65 0.18 260</span></div><div class="role">Meetings · AI draft</div></div>
</div>
</body></html>

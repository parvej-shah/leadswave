<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:var(--canvas);}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;gap:18px}
.label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-4);width:120px;flex-shrink:0}
</style></head><body>
<div class="stack">
  <div class="row"><span class="label">Eyebrow</span><span style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.20em;color:var(--amber)">LEADSWAVE</span></div>
  <div class="row"><span class="label">Mono label</span><span style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-4)">COMPANY NAME</span></div>
  <div class="row"><span class="label">Mono body</span><span style="font-family:var(--font-mono);font-size:13px;color:var(--fg-2)">acme-corp.io</span></div>
  <div class="row"><span class="label">Numeric</span><span style="font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;color:var(--fg-1)">12,847</span></div>
  <div class="row"><span class="label">Timestamp</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-4)">12m ago</span></div>
</div>
</body></html>

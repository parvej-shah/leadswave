<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--canvas);display:flex;flex-direction:column;gap:14px}
.empty{border:1px dashed oklch(0.22 0 0);border-radius:8px;padding:36px;text-align:center;width:560px}
.empty p{margin:0 0 10px;font-family:var(--font-mono);font-size:13px;color:var(--fg-4)}
.empty a{font-family:var(--font-mono);font-size:13px;color:var(--amber);text-decoration:underline;text-underline-offset:4px}
.toast{display:inline-flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;background:var(--success-tinted-surface);color:var(--success);border:1px solid var(--success-border);font-family:var(--font-mono);font-size:12px;letter-spacing:0.02em;width:fit-content}
.toast .pill{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.1em;padding:1px 6px;border-radius:3px;background:oklch(1 0 0 / 6%)}
</style></head><body>
<div class="empty">
  <p>No campaigns yet.</p>
  <a>Launch your first campaign →</a>
</div>
<div class="toast"><span class="pill">SENT</span>Reply sent to Acme Robotics</div>
</body></html>

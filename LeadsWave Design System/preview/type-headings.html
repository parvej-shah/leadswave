<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:var(--canvas);}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;gap:18px}
.label{font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-4);width:120px;flex-shrink:0}
.specimen{color:var(--fg-1)}
</style></head><body>
<div class="stack">
  <div class="row"><span class="label">Display · sans</span><span class="specimen" style="font-family:var(--font-sans);font-weight:600;font-size:30px;letter-spacing:-0.02em">Welcome back.</span></div>
  <div class="row"><span class="label">H1 · sans</span><span class="specimen" style="font-family:var(--font-sans);font-weight:600;font-size:24px;letter-spacing:-0.02em;color:var(--fg-1)">Dashboard</span></div>
  <div class="row"><span class="label">H2 · mono</span><span class="specimen" style="font-family:var(--font-mono);font-weight:500;font-size:15px;color:var(--fg-2)">Campaign Health</span></div>
  <div class="row"><span class="label">Body · sans</span><span class="specimen" style="font-family:var(--font-sans);font-size:13px;color:var(--fg-3)">Scout finds companies matching your query.</span></div>
</div>
</body></html>

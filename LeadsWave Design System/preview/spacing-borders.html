<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:18px;background:var(--canvas);display:flex;gap:18px}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--fg-4)}
.b{width:120px;height:60px;border-radius:6px;background:var(--surface)}
.b1{border:1px solid oklch(1 0 0 / 4%)}
.b2{border:1px solid oklch(1 0 0 / 7%)}
.b3{border:1px solid oklch(1 0 0 / 12%)}
.b4{border:1px solid var(--amber-border)}
</style></head><body>
<div class="col"><div class="b b1"></div><div class="lbl">SOFT · 4%</div><div class="lbl" style="text-transform:none;letter-spacing:0;color:var(--fg-3)">Table row dividers</div></div>
<div class="col"><div class="b b2"></div><div class="lbl">DEFAULT · 7%</div><div class="lbl" style="text-transform:none;letter-spacing:0;color:var(--fg-3)">Cards, sections</div></div>
<div class="col"><div class="b b3"></div><div class="lbl">STRONG · 12%</div><div class="lbl" style="text-transform:none;letter-spacing:0;color:var(--fg-3)">Focused inputs</div></div>
<div class="col"><div class="b b4"></div><div class="lbl" style="color:var(--amber)">AMBER · 30%</div><div class="lbl" style="text-transform:none;letter-spacing:0;color:var(--fg-3)">Badge outlines</div></div>
</body></html>
